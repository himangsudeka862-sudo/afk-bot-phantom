
name: Minecraft Bot Uptime
on:
schedule:
- cron: '*/20 * * * *'
workflow_dispatch:
jobs:
keep-alive:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Set up Node.js
uses: actions/setup-node@v4
with:
node-version: 18
- name: Install dependencies
run: npm install
- name: Run Bot Script
run: node index.js
